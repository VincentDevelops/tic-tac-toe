<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/scripts/player.js" defer></script>
    <script src="/scripts/gameBoard.js" defer></script>
    <script src="/scripts/gameState.js" defer></script>
    <script src="/scripts/gameController.js" defer></script>
    <script src="/scripts/displayController.js" defer></script>
    <script src="/scripts/main.js" defer></script>
    <link rel="stylesheet" href="/styles/modern-normalize.css">
    <link rel="stylesheet" href="/styles/style.css">
    
    <title>Tic-Tac-Toe</title>
</head>
<body>

    <div class="container flex">

        <header class="container-header">
            
        </header>

        <main class="container-main flex">

            <div class="board-container grid">


                <div class="slot top-left-slot" data-row="0" data-column="0"></div>
                <div class="slot top-middle-slot" data-row="0" data-column="1"></div>
                <div class="slot top-right-slot" data-row="0" data-column="2"></div>
                
                <div class="slot middle-left-slot" data-row="1" data-column="0"></div>
                <div class="slot middle-slot" data-row="1" data-column="1"></div>
                <div class="slot middle-right-slot" data-row="1" data-column="2"></div>

                <div class="slot bottom-left-slot" data-row="2" data-column="0"></div>
                <div class="slot bottom-middle-slot" data-row="2" data-column="1"></div>
                <div class="slot bottom-right-slot" data-row="2" data-column="2"></div>


            </div>

        </main>

    </div>

</body>
</html>
